<!DOCTYPE html>
<html lang="it" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>TrackIt — Treni in Tempo Reale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg: #000000;
      --bg-hover: #0a0a0a;
      --border: #222222;
      --text: #ffffff;
      --text2: #888888;
      --accent: #ffffff;
      --red: #ff3333;
      --green: #33ff33;
      --delay-warn: 5;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --bg-hover: #f9f9f9;
      --border: #e0e0e0;
      --text: #000000;
      --text2: #777777;
      --accent: #000000;
      --red: #e60000;
      --green: #00b300;
    }

    /* ── RESET ──────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
      color: inherit;
    }

    input {
      font-family: 'Inter', sans-serif;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
    }

    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    /* ── SCROLLBAR ──────────────────────────────────────────── */
    ::-webkit-scrollbar {
      width: 2px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    /* ── LAYOUT ─────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 1.5rem clamp(1rem, 4vw, 2.5rem);
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-weight: 500;
      font-size: 1.2rem;
      color: var(--text);
      letter-spacing: -0.02em;
      text-transform: lowercase;
    }

    nav {
      margin-left: auto;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-btn {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text2);
      transition: color 0.2s;
    }

    .nav-btn:hover {
      color: var(--text);
    }

    .nav-btn.active {
      color: var(--text);
      font-weight: 500;
    }

    #theme-toggle {
      color: var(--text2);
      font-size: 1rem;
      transition: color 0.2s;
    }

    #theme-toggle:hover {
      color: var(--text);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) clamp(1rem, 4vw, 2.5rem);
    }

    /* ── TICKER ─────────────────────────────────────────────── */
    #ticker-bar {
      display: none;
    }

    /* ── SECTIONS ───────────────────────────────────────────── */
    .section {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ── STAT BAR ───────────────────────────────────────────── */
    .stat-bar {
      display: flex;
      gap: 3rem;
      margin-bottom: 4rem;
      flex-wrap: wrap;
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--text2);
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 2.5rem;
      font-weight: 300;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .stat-val.green {
      color: var(--text);
    }

    /* ── SEARCH BOX ─────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 2rem;
    }

    .search-input {
      width: 100%;
      padding: 1rem 0;
      font-size: 2rem;
      font-weight: 300;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s;
    }

    .search-input::placeholder {
      color: var(--border);
    }

    .search-input:focus {
      border-color: var(--text);
    }

    .search-icon {
      display: none;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      z-index: 50;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-list.open {
      display: block;
    }

    .ac-item {
      padding: 1rem;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text2);
      transition: background 0.1s, color 0.1s;
    }

    .ac-item:hover,
    .ac-item.selected {
      background: var(--bg-hover);
      color: var(--text);
    }

    .ac-icon {
      display: none;
    }

    /* ── CONTROLS ROW ───────────────────────────────────────── */
    .controls-row {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .pill-btn {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s;
      position: relative;
    }

    .pill-btn:hover {
      color: var(--text);
    }

    .pill-btn.active {
      color: var(--text);
      font-weight: 500;
    }

    .pill-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1.1rem;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--text);
    }

    .delay-wrap {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .delay-wrap input {
      width: 40px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.2rem;
    }

    /* ── TABLE / BOARD ──────────────────────────────────────── */
    .board {
      margin-top: 2rem;
    }

    .board-header {
      display: grid;
      grid-template-columns: 110px 1fr 90px 90px 110px 80px;
      gap: 1rem;
      padding: 0.5rem 0;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--text2);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .train-row {
      display: grid;
      grid-template-columns: 110px 1fr 90px 90px 110px 80px;
      gap: 1rem;
      padding: 1rem 0;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
      border-bottom: 1px solid var(--border);
    }

    .train-row:last-child {
      border-bottom: none;
    }

    .train-row:hover {
      opacity: 0.6;
    }

    .train-num {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .train-dest {
      font-size: 1rem;
      font-weight: 400;
    }

    .train-dest small {
      display: block;
      font-size: 0.75rem;
      color: var(--text2);
      margin-top: 0.2rem;
    }

    .time-cell {
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      font-weight: 300;
    }

    .delay-badge {
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      font-weight: 400;
    }

    .delay-ok {
      color: var(--text2);
    }

    .delay-warn {
      color: var(--text);
    }

    .delay-crit {
      color: var(--red);
    }

    .status-pill {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-ok {
      color: var(--text2);
    }

    .status-warn {
      color: var(--text);
    }

    .status-stop {
      color: var(--red);
    }

    /* ── TRAIN DETAIL PANEL ─────────────────────────────────── */
    #detail-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    #detail-panel.open {
      display: block;
    }

    .detail-card {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) clamp(1rem, 4vw, 2.5rem);
    }

    .detail-head {
      display: flex;
      align-items: flex-end;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .detail-head h2 {
      font-size: 4rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .detail-head p {
      font-size: 1.2rem;
      color: var(--text2);
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .close-btn {
      position: fixed;
      top: 2rem;
      right: 2rem;
      font-size: 1rem;
      color: var(--text2);
      transition: color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .close-btn:hover {
      color: var(--text);
    }

    /* ── LEAFLET MAP ─────────────────────────────────────────── */
    .train-map {
      width: 100%;
      height: 400px;
      background: var(--bg-hover);
      position: relative;
      margin-bottom: 4rem;
      filter: grayscale(100%) contrast(1.2);
      opacity: 0.8;
    }

    .train-map .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      font-size: 0.85rem;
      z-index: 1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── FERMATA LIST ────────────────────────────────────────── */
    .stops-section {
      margin-top: 2rem;
    }

    .stops-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s;
      border-bottom: 1px solid var(--text);
      padding-bottom: 0.2rem;
      margin-bottom: 2rem;
    }

    .stops-toggle:hover {
      opacity: 0.6;
    }

    .stops-toggle svg {
      display: none;
    }

    .stops-list {
      display: none;
      flex-direction: column;
      gap: 0;
    }

    .stops-list.visible {
      display: flex;
    }

    .stop-item {
      display: grid;
      grid-template-columns: 20px 1fr auto auto;
      gap: 1rem;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .stop-item:last-child {
      border-bottom: none;
    }

    .stop-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      margin: auto;
    }

    .stop-dot.passed {
      background: var(--text2);
    }

    .stop-dot.current {
      background: var(--text);
      width: 8px;
      height: 8px;
    }

    .stop-name {
      font-size: 1rem;
      font-weight: 300;
    }

    .stop-name small {
      display: inline-block;
      margin-left: 0.5rem;
      font-size: 0.75rem;
      color: var(--text2);
    }

    .stop-time {
      font-size: 1rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--text2);
    }

    .stop-delay {
      font-size: 0.85rem;
      text-align: right;
      min-width: 50px;
    }

    /* ── SEARCH TRENO ───────────────────────────────────────── */
    .train-search-row {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
    }

    .train-search-row .search-wrap {
      flex: 1;
      margin-bottom: 0;
    }

    .go-btn {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      border-bottom: 1px solid var(--text);
      padding-bottom: 0.5rem;
      transition: opacity 0.2s;
      margin-bottom: 1rem;
    }

    .go-btn:hover {
      opacity: 0.6;
    }

    /* ── NEWS ───────────────────────────────────────────────── */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .news-item {
      cursor: pointer;
      transition: opacity 0.2s;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .news-item:hover {
      opacity: 0.6;
    }

    .news-title {
      font-size: 1.2rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .news-date {
      font-size: 0.75rem;
      color: var(--text2);
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .news-body {
      font-size: 0.95rem;
      color: var(--text2);
      margin-top: 1rem;
      line-height: 1.6;
      font-weight: 300;
      display: none;
    }

    .news-item.expanded .news-body {
      display: block;
    }

    /* ── LANG TOGGLE ─────────────────────────────────────────── */
    .lang-btn {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--text2);
      transition: color 0.2s;
      margin-left: 0.5rem;
    }

    .lang-btn.active {
      color: var(--text);
      font-weight: 500;
    }

    /* ── EMPTY / LOADER ─────────────────────────────────────── */
    .empty {
      text-align: left;
      padding: 4rem 0;
      color: var(--text2);
      font-size: 1.2rem;
      font-weight: 300;
    }

    .empty-icon {
      display: none;
    }

    .loader {
      display: flex;
      justify-content: flex-start;
      padding: 3rem 0;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 1px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── TOAST ───────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 300;
    }

    .toast {
      padding: 1rem 1.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--text);
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ── HISTORY CHIPS ──────────────────────────────────────── */
    .history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .chip {
      font-size: 0.85rem;
      color: var(--text2);
      transition: color 0.2s;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 4px;
    }

    .chip:hover {
      color: var(--text);
      text-decoration-color: var(--text);
    }

    .chip-label {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 0.5rem;
      display: block;
    }

    /* ── SECTION TITLE ───────────────────────────────────────── */
    .section-title {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    /* ── TRAIN RESULT WRAP ───────────────────────────────────── */
    #train-result-wrap .board {
      margin-bottom: 2rem;
    }

    #train-result-wrap .detail-head {
      display: none;
    }

    /* ── MOBILE ──────────────────────────────────────────────── */
    @media(max-width: 700px) {

      .board-header,
      .train-row {
        grid-template-columns: 60px 1fr 70px;
        gap: 0.5rem;
      }

      .board-header> :nth-child(4),
      .board-header> :nth-child(5),
      .board-header> :nth-child(6),
      .train-row> :nth-child(4),
      .train-row> :nth-child(5),
      .train-row> :nth-child(6) {
        display: none;
      }

      .stop-item {
        grid-template-columns: 16px 1fr auto;
      }

      .stop-delay {
        display: none;
      }

      .train-map {
        height: 250px;
      }

      .stat-bar {
        gap: 1.5rem;
      }

      .stat-val {
        font-size: 1.8rem;
      }

      header {
        flex-wrap: wrap;
        gap: 1rem;
      }

      nav {
        width: 100%;
        justify-content: space-between;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">TRACK IT</div>
    <nav>
      <button class="nav-btn active" data-i18n="nav_stations" onclick="showSection('stazioni')">Stazioni</button>
      <button class="nav-btn" data-i18n="nav_train" onclick="showSection('treno')">Treni</button>
      <button class="nav-btn" data-i18n="nav_news" onclick="showSection('news')">News</button>
      <button class="lang-btn active" id="lang-it" onclick="setLang('it')">IT</button>
      <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
    </nav>
    <button id="theme-toggle" onclick="toggleTheme()" title="Tema chiaro/scuro">🌙</button>
  </header>

  <!-- TICKER (hidden per spec) -->
  <div id="ticker-bar">
    <div id="ticker-inner"></div>
  </div>

  <!-- MAIN -->
  <main>

    <!-- ── SEZIONE STAZIONI ── -->
    <div class="section active" id="sec-stazioni">
      <div class="stat-bar" id="stat-bar">
        <div class="stat-card"><span class="stat-label" data-i18n="stat_running">Circolanti</span><span class="stat-val"
            id="s-circolanti">—</span></div>
        <div class="stat-card"><span class="stat-label" data-i18n="stat_daily">Treni oggi</span><span
            class="stat-val green" id="s-giorno">—</span></div>
        <div class="stat-card"><span class="stat-label" data-i18n="stat_updated">Aggiornato</span><span class="stat-val"
            id="s-ts">—</span></div>
      </div>

      <div id="history-wrap" style="display:none">
        <span class="chip-label" data-i18n="recent">Recenti</span>
        <div class="history-chips" id="history-chips"></div>
      </div>

      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="stat-input" type="text" data-i18n-placeholder="search_station_placeholder"
          placeholder="Cerca stazione… (es. Roma, Milano, Napoli)" autocomplete="off" />
        <div class="autocomplete-list" id="stat-ac"></div>
      </div>

      <div class="controls-row">
        <button class="pill-btn active" id="btn-partenze" data-i18n="departures"
          onclick="toggleDir('partenze')">Partenze</button>
        <button class="pill-btn" id="btn-arrivi" data-i18n="arrivals" onclick="toggleDir('arrivi')">Arrivi</button>
        <div class="delay-warn-wrap delay-wrap">
          <span data-i18n="delay_threshold">Soglia ritardo:</span>
          <input type="number" id="delay-threshold" value="5" min="1" max="120" /> min
        </div>
      </div>

      <div id="board-wrap">
        <div class="empty">
          <div class="empty-icon">🗺️</div><span data-i18n="empty_station">Seleziona una stazione per vedere i
            treni</span>
        </div>
      </div>
    </div>

    <!-- ── SEZIONE TRENO ── -->
    <div class="section" id="sec-treno">
      <div class="section-title" data-i18n="search_train">Cerca Treno</div>
      <div class="train-search-row">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="train-input" type="text" data-i18n-placeholder="search_train_placeholder"
            placeholder="Numero treno… (es. 9501, 500)" autocomplete="off" />
          <div class="autocomplete-list" id="train-ac"></div>
        </div>
        <button class="go-btn" data-i18n="search_btn" onclick="searchTrain()">Cerca</button>
      </div>
      <div id="train-result-wrap">
        <div class="empty">
          <div class="empty-icon">🚄</div><span data-i18n="empty_train">Inserisci un numero treno</span>
        </div>
      </div>
    </div>

    <!-- ── SEZIONE NEWS ── -->
    <div class="section" id="sec-news">
      <div class="section-title" data-i18n="news_title">News &amp; Avvisi</div>
      <div id="news-wrap">
        <div class="loader">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- DETAIL PANEL (percorso treno) -->
  <div id="detail-panel">
    <div class="detail-card">
      <div class="detail-head">
        <div>
          <h2 id="dp-train-num">—</h2>
          <p id="dp-train-info">Caricamento…</p>
        </div>
        <div id="dp-delay-badge" class="delay-badge"></div>
        <button class="close-btn" data-i18n="close_btn" onclick="closeDetail()">CHIUDI</button>
      </div>
      <!-- map rendered here by initTrainMap -->
      <div id="dp-map-wrap"></div>
      <div class="stops-section" id="dp-stops-section"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ════════════════════════════════════════════════════
       CONFIG
    ════════════════════════════════════════════════════ */
    const API = 'http://localhost:8000';
    let currentStation = null;
    let currentDir = 'partenze';
    let currentLang = 'it';
    let stationHistory = JSON.parse(localStorage.getItem('rv_history') || '[]');
    let refreshTimer = null;
    let statsInterval = null;

    // Leaflet map lifecycle
    let _leafletMap = null;

    /* ════════════════════════════════════════════════════
       I18N TRANSLATIONS
    ════════════════════════════════════════════════════ */
    const i18n = {
      it: {
        nav_stations: 'Stazioni',
        nav_train: 'Treno',
        nav_news: 'News',
        stat_running: 'Circolanti',
        stat_daily: 'Treni oggi',
        stat_updated: 'Aggiornato',
        recent: 'Recenti',
        search_station_placeholder: 'Cerca stazione… (es. Roma, Milano, Napoli)',
        departures: 'Partenze',
        arrivals: 'Arrivi',
        delay_threshold: 'Soglia ritardo:',
        empty_station: 'Seleziona una stazione per vedere i treni',
        search_train: 'Cerca Treno',
        search_train_placeholder: 'Numero treno… (es. 9501, 500)',
        search_btn: 'Cerca',
        empty_train: 'Inserisci un numero treno',
        news_title: 'News & Avvisi',
        on_time: 'In orario',
        regular: 'Regolare',
        delay: 'Ritardo',
        destination: 'Destinazione',
        origin: 'Provenienza',
        departure: 'Partenza',
        arrival: 'Arrivo',
        number: 'Numero',
        platform: 'Binario',
        status: 'Stato',
        loading_map: 'Caricamento mappa…',
        loading: 'Caricamento…',
        no_trains: 'Nessun treno trovato',
        error_loading: 'Errore caricamento dati',
        error_search: 'Errore nella ricerca',
        route_unavailable: 'Percorso non disponibile',
        no_data: 'Nessun dato',
        no_news: 'Nessuna news disponibile',
        error_news: 'Errore caricamento news',
        no_geo: 'Nessuna stazione geolocalizzata',
        show_stops: 'Mostra fermate',
        hide_stops: 'Nascondi fermate',
        error_trains: 'Errore nel caricare i treni',
        loading_route: 'Caricamento percorso…',
        close_btn: 'Chiudi',
      },
      en: {
        nav_stations: 'Stations',
        nav_train: 'Trains',
        nav_news: 'News',
        stat_running: 'Running',
        stat_daily: 'Trains today',
        stat_updated: 'Updated',
        recent: 'Recent',
        search_station_placeholder: 'Search station… (e.g. Roma, Milano, Napoli)',
        departures: 'Departures',
        arrivals: 'Arrivals',
        delay_threshold: 'Delay threshold:',
        empty_station: 'Select a station to see trains',
        search_train: 'Search Train',
        search_train_placeholder: 'Train number… (e.g. 9501, 500)',
        search_btn: 'Search',
        empty_train: 'Enter a train number',
        news_title: 'News & Alerts',
        on_time: 'On time',
        regular: 'On time',
        delay: 'Delayed',
        destination: 'Destination',
        origin: 'Origin',
        departure: 'Departure',
        arrival: 'Arrival',
        number: 'Number',
        platform: 'Platform',
        status: 'Status',
        loading_map: 'Loading map…',
        loading: 'Loading…',
        no_trains: 'No trains found',
        error_loading: 'Error loading data',
        error_search: 'Error searching',
        route_unavailable: 'Route not available',
        no_data: 'No data',
        no_news: 'No news available',
        error_news: 'Error loading news',
        no_geo: 'No geolocated stations',
        show_stops: 'Show stops',
        hide_stops: 'Hide stops',
        error_trains: 'Error loading trains',
        loading_route: 'Loading route…',
        close_btn: 'Close',
      }
    };

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || i18n.it[key] || key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
      });
    }

    /* ════════════════════════════════════════════════════
       UTILITIES
    ════════════════════════════════════════════════════ */
    async function apiFetch(path) {
      const r = await fetch(`${API}${path}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    function fmtTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    function fmtDate(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
    }

    function delayClass(min) {
      if (!min || min <= 0) return 'delay-ok';
      const thr = parseInt(document.getElementById('delay-threshold').value) || 5;
      if (min >= thr * 2) return 'delay-crit';
      if (min >= thr) return 'delay-warn';
      return 'delay-ok';
    }
    function delayText(min) {
      if (!min || min <= 0) return t('on_time');
      return `+${min} min`;
    }

    function toast(msg, type = 'ok') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

    /* ════════════════════════════════════════════════════
       THEME
    ════════════════════════════════════════════════════ */
    function toggleTheme() {
      const h = document.documentElement;
      const next = h.dataset.theme === 'dark' ? 'light' : 'dark';
      h.dataset.theme = next;
      document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
      // update tile layer if map is active
      if (_leafletMap) {
        _leafletMap.eachLayer(l => { if (l._url) _leafletMap.removeLayer(l); });
        L.tileLayer(getTileUrl(), { attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 18 }).addTo(_leafletMap);
      }
    }

    function getTileUrl() {
      const dark = document.documentElement.dataset.theme === 'dark';
      return dark
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
    }

    /* ════════════════════════════════════════════════════
       LANG
    ════════════════════════════════════════════════════ */
    function setLang(l) {
      currentLang = l;
      document.getElementById('lang-it').classList.toggle('active', l === 'it');
      document.getElementById('lang-en').classList.toggle('active', l === 'en');
      applyTranslations();
    }

    /* ════════════════════════════════════════════════════
       SECTIONS
    ════════════════════════════════════════════════════ */
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(`sec-${id}`).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase().includes(id.substring(0, 3)));
      });
      if (id === 'news') loadNews();
    }

    /* ════════════════════════════════════════════════════
       STATISTICHE
    ════════════════════════════════════════════════════ */
    async function loadStats() {
      try {
        const d = await apiFetch('/statistiche');
        const circ = d?.treniCircolanti ?? '—';
        const giorno = d?.treniGiorno ?? '—';
        document.getElementById('s-circolanti').textContent = circ;
        document.getElementById('s-giorno').textContent = giorno;
        document.getElementById('s-ts').textContent = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { /* silently */ }
    }

    /* ════════════════════════════════════════════════════
       AUTOCOMPLETE STAZIONI
    ════════════════════════════════════════════════════ */
    let acTimer = null;
    const statInput = document.getElementById('stat-input');
    const statAc = document.getElementById('stat-ac');
    let acResults = [];
    let acIdx = -1;

    statInput.addEventListener('input', () => {
      clearTimeout(acTimer);
      const v = statInput.value.trim();
      if (v.length < 2) { statAc.classList.remove('open'); return; }
      acTimer = setTimeout(() => fetchStationAc(v), 250);
    });

    statInput.addEventListener('keydown', e => {
      if (!statAc.classList.contains('open')) return;
      const items = statAc.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx + 1, items.length - 1); updateAcSel(items); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx - 1, 0); updateAcSel(items); }
      else if (e.key === 'Enter' && acIdx >= 0) { items[acIdx].click(); }
      else if (e.key === 'Escape') { statAc.classList.remove('open'); }
    });

    function updateAcSel(items) {
      items.forEach((el, i) => el.classList.toggle('selected', i === acIdx));
    }

    async function fetchStationAc(q) {
      try {
        const data = await apiFetch(`/searchstat/${encodeURIComponent(q)}`);
        acResults = Array.isArray(data) ? data : [];
        renderStationAc(acResults);
      } catch (e) { statAc.classList.remove('open'); }
    }

    function renderStationAc(list) {
      if (!list.length) { statAc.classList.remove('open'); return; }
      statAc.innerHTML = list.slice(0, 8).map((s, i) => `
    <div class="ac-item" data-id="${s.id}" data-name="${s.nomeLungo || s.nome || ''}" onclick="selectStation('${s.id}','${(s.nomeLungo || s.nome || '').replace(/'/g, "\\'")}')">
      <span class="ac-icon">🚉</span>${s.nomeLungo || s.nome || '—'}
    </div>
  `).join('');
      acIdx = -1;
      statAc.classList.add('open');
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#stat-input') && !e.target.closest('#stat-ac')) statAc.classList.remove('open');
    });

    /* ════════════════════════════════════════════════════
       HISTORY
    ════════════════════════════════════════════════════ */
    function saveHistory(id, name) {
      stationHistory = stationHistory.filter(h => h.id !== id);
      stationHistory.unshift({ id, name });
      if (stationHistory.length > 6) stationHistory.pop();
      localStorage.setItem('rv_history', JSON.stringify(stationHistory));
      renderHistory();
    }

    function renderHistory() {
      const wrap = document.getElementById('history-wrap');
      const chips = document.getElementById('history-chips');
      if (!stationHistory.length) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      chips.innerHTML = stationHistory.map(h =>
        `<button class="chip" onclick="selectStation('${h.id}','${h.name.replace(/'/g, "\\'")}')">🚉 ${h.name}</button>`
      ).join('');
    }

    /* ════════════════════════════════════════════════════
       SELECT STATION
    ════════════════════════════════════════════════════ */
    function selectStation(id, name) {
      currentStation = { id, name };
      statInput.value = name;
      statAc.classList.remove('open');
      saveHistory(id, name);
      clearInterval(refreshTimer);
      loadBoard();
      refreshTimer = setInterval(loadBoard, 30000);
    }

    /* ════════════════════════════════════════════════════
       TOGGLE DIR
    ════════════════════════════════════════════════════ */
    function toggleDir(dir) {
      currentDir = dir;
      document.getElementById('btn-partenze').classList.toggle('active', dir === 'partenze');
      document.getElementById('btn-arrivi').classList.toggle('active', dir === 'arrivi');
      if (currentStation) loadBoard();
    }

    /* ════════════════════════════════════════════════════
       LOAD BOARD (partenze/arrivi)
    ════════════════════════════════════════════════════ */
    async function loadBoard() {
      if (!currentStation) return;
      const wrap = document.getElementById('board-wrap');
      wrap.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const pad = function (n) { return String(n).padStart(2, '0'); };
        const dtStr = days[now.getDay()] + ' ' + months[now.getMonth()] + ' ' + pad(now.getDate()) + ' ' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        const data = await apiFetch('/' + currentDir + '/' + currentStation.id + '/' + encodeURIComponent(dtStr));
        renderBoard(data);
      } catch (e) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${t('error_loading')}</div>`;
        toast(t('error_trains'), 'warn');
      }
    }

    function renderBoard(trains) {
      const thr = parseInt(document.getElementById('delay-threshold').value) || 5;
      const wrap = document.getElementById('board-wrap');
      if (!trains || !trains.length) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">😴</div>${t('no_trains')}</div>`;
        return;
      }

      trains.forEach(tr => {
        const del = tr.ritardo || tr.ritardoPartenza || 0;
        if (del >= thr) toast(`${tr.compNumeroTreno || tr.numeroTreno}: +${del} min`, del >= thr * 2 ? 'crit' : 'warn');
      });

      const dir = currentDir === 'partenze';
      wrap.innerHTML = `
    <div class="board">
      <div class="board-header">
        <div>${t('number')}</div>
        <div>${dir ? t('destination') : t('origin')}</div>
        <div>${dir ? t('departure') : t('arrival')}</div>
        <div>${t('delay')}</div>
        <div>${t('platform')}</div>
        <div>${t('status')}</div>
      </div>
      ${trains.map((tr, i) => renderRow(tr, i, dir)).join('')}
    </div>
  `;
    }

    function renderRow(tr, i, isPartenza) {
      const num = tr.compNumeroTreno || tr.numeroTreno || '—';
      const apiNum = tr.numeroTreno || num;
      const dest = isPartenza ? (tr.destinazione || '—') : (tr.origine || '—');
      const cat = tr.compOrarioPartenzaZeroEffettivo || tr.categoriaDescrizione || '';
      const rawDep = isPartenza ? tr.orarioPartenza : tr.orarioArrivo;
      const rawDel = tr.ritardo || tr.ritardoPartenza || tr.ritardoArrivo || 0;
      const binarioStr = isPartenza ? (tr.binarioEffettivoPartenzaDescrizione || tr.binarioProgrammatoPartenzaDescrizione) : (tr.binarioEffettivoArrivoDescrizione || tr.binarioProgrammatoArrivoDescrizione);
      const isEffettivo = isPartenza ? !!tr.binarioEffettivoPartenzaDescrizione : !!tr.binarioEffettivoArrivoDescrizione;
      const via = isEffettivo ? '✔ ' + binarioStr : (binarioStr || '—');
      const stato = rawDel > 10 ? 'warn' : rawDel > 0 ? 'warn' : 'ok';

      return `
    <div class="train-row" style="animation-delay:${i * 0.04}s"
         onclick="openTrainDetail('${apiNum}','${tr.idOrigine || ''}')">
      <div class="train-num">${num}</div>
      <div class="train-dest">${dest}<small>${cat}</small></div>
      <div class="time-cell">${fmtTime(rawDep)}</div>
      <div><span class="delay-badge ${delayClass(rawDel)}">${delayText(rawDel)}</span></div>
      <div class="time-cell" style="font-size:.8rem">${via}</div>
      <div><span class="status-pill status-${stato}">${stato === 'ok' ? t('regular') : t('delay')}</span></div>
    </div>
  `;
    }

    /* ════════════════════════════════════════════════════
       TRAIN AUTOCOMPLETE (sezione treno)
    ════════════════════════════════════════════════════ */
    let trainAcTimer = null;
    const trainInput = document.getElementById('train-input');
    const trainAc = document.getElementById('train-ac');

    trainInput.addEventListener('input', () => {
      clearTimeout(trainAcTimer);
      const v = trainInput.value.trim();
      if (v.length < 2) { trainAc.classList.remove('open'); return; }
      trainAcTimer = setTimeout(() => fetchTrainAc(v), 300);
    });

    async function fetchTrainAc(q) {
      try {
        const data = await apiFetch(`/trainautocomplete/${encodeURIComponent(q)}`);
        const lines = (typeof data === 'string' ? data : JSON.stringify(data)).split('\n').filter(Boolean);
        if (!lines.length) { trainAc.classList.remove('open'); return; }
        trainAc.innerHTML = lines.slice(0, 6).map(l => {
          const parts = l.split(' - ');
          const num = parts[0] || l;
          const stat = (parts[1] || '').split('|')[0];
          return `<div class="ac-item" onclick="selectTrain('${num}')">
        <span class="ac-icon">🚄</span><b>${num}</b><small style="color:var(--text2);margin-left:.5rem">${stat}</small>
      </div>`;
        }).join('');
        trainAc.classList.add('open');
      } catch (e) { trainAc.classList.remove('open'); }
    }

    function selectTrain(num) {
      trainInput.value = num;
      trainAc.classList.remove('open');
      searchTrain();
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#train-input') && !e.target.closest('#train-ac')) trainAc.classList.remove('open');
    });

    /* ════════════════════════════════════════════════════
       SEARCH TRAIN
    ════════════════════════════════════════════════════ */
    async function searchTrain() {
      const num = trainInput.value.trim();
      if (!num) return;
      const wrap = document.getElementById('train-result-wrap');
      wrap.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const info = await apiFetch(`/traininfo/${encodeURIComponent(num)}`);

        let stationId, ts;
        if (typeof info === 'string') {
          const parts = info.trim().split('|');
          stationId = parts[1] || '';
          ts = parseInt(parts[2]) || Date.now();
        } else {
          const arr = Array.isArray(info) ? info : [info];
          const ti = arr[0] || {};
          stationId = ti.codLocOrig || ti.idOrigine || '';
          ts = ti.dataPartenza ? new Date(ti.dataPartenza).getTime() : Date.now();
        }

        await loadTrainRoute(num, stationId, ts, wrap);
      } catch (e) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${t('error_search')}</div>`;
      }
    }

    async function loadTrainRoute(num, stationId, ts, container) {
      try {
        const data = await apiFetch(`/andamentotreno/${stationId}/${num}/${ts}`);
        renderTrainRoute(data, container);
      } catch (e) {
        if (container) container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${t('route_unavailable')}</div>`;
      }
    }

    function renderTrainRoute(data, container) {
      if (!data) {
        if (container) container.innerHTML = `<div class="empty">${t('no_data')}</div>`;
        return;
      }
      const stops = data.fermate || [];
      const delay = data.ritardo || 0;
      const dc = delayClass(delay);

      const mapId = 'train-route-map-' + Date.now();

      const html = `
    <div class="board" style="margin-bottom:1rem">
      <div class="detail-head">
        <div>
          <h2>${data.numeroTreno || '—'}</h2>
          <p>${data.origine || ''} → ${data.destinazione || ''}</p>
        </div>
        <div class="delay-badge ${dc}" style="margin-left:auto">${delayText(delay)}</div>
      </div>
      <div class="train-map" id="${mapId}">
        <div class="map-loading"><div class="spinner"></div> ${t('loading_map')}</div>
      </div>
      ${buildStopsList(stops)}
    </div>
  `;
      if (container) container.innerHTML = html;

      // slight delay so DOM is painted
      setTimeout(() => initTrainMap(stops, mapId), 60);
    }

    /* ════════════════════════════════════════════════════
       OPEN TRAIN DETAIL (from board)
    ════════════════════════════════════════════════════ */
    async function openTrainDetail(num, stationId) {
      const panel = document.getElementById('detail-panel');
      panel.classList.add('open');
      document.getElementById('dp-train-num').textContent = num;
      document.getElementById('dp-train-info').textContent = t('loading_route');
      document.getElementById('dp-map-wrap').innerHTML = '';
      document.getElementById('dp-stops-section').innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      document.getElementById('dp-delay-badge').className = 'delay-badge';
      document.getElementById('dp-delay-badge').textContent = '';

      // Destroy existing map
      if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }

      try {
        const info = await apiFetch(`/traininfo/${encodeURIComponent(num)}`);

        let sid, ts;
        if (typeof info === 'string') {
          const parts = info.trim().split('|');
          sid = stationId || parts[1] || '';
          ts = parseInt(parts[2]) || Date.now();
        } else {
          const arr = Array.isArray(info) ? info : [info];
          const ti = arr[0] || {};
          sid = stationId || ti.codLocOrig || ti.idOrigine || '';
          ts = ti.dataPartenza ? new Date(ti.dataPartenza).getTime() : Date.now();
        }

        const data = await apiFetch(`/andamentotreno/${sid}/${num}/${ts}`);
        if (!data) { throw new Error('no data'); }

        const delay = data.ritardo || 0;
        const dc = delayClass(delay);
        document.getElementById('dp-train-info').textContent = `${data.origine || '?'} → ${data.destinazione || '?'}`;
        const badge = document.getElementById('dp-delay-badge');
        badge.className = `delay-badge ${dc}`;
        badge.textContent = delayText(delay);

        const stops = data.fermate || [];

        // Inject map container into dp-map-wrap
        const mapId = 'dp-leaflet-map';
        document.getElementById('dp-map-wrap').innerHTML = `
      <div class="train-map" id="${mapId}">
        <div class="map-loading"><div class="spinner"></div> ${t('loading_map')}</div>
      </div>
    `;

        // Render stops list
        document.getElementById('dp-stops-section').innerHTML = buildStopsList(stops);

        // Init map (give DOM a tick)
        setTimeout(() => initTrainMap(stops, mapId), 60);

      } catch (e) {
        document.getElementById('dp-stops-section').innerHTML = `<div class="empty">${t('route_unavailable')}</div>`;
      }
    }

    function closeDetail() {
      document.getElementById('detail-panel').classList.remove('open');
      if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }
    }
    document.getElementById('detail-panel').addEventListener('click', e => {
      if (e.target === document.getElementById('detail-panel')) closeDetail();
    });

    /* ════════════════════════════════════════════════════
       BUILD STOPS LIST HTML
    ════════════════════════════════════════════════════ */
    function buildStopsList(stops) {
      if (!stops.length) return '';
      return `
    <div class="stops-section">
      <div class="stops-toggle" id="stops-toggle-${Date.now()}" onclick="toggleStopsList(this)">
        <span>${t('show_stops')} (${stops.length})</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 4.5l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="stops-list">
        ${stops.map((s, i) => renderStop(s, i, stops.length)).join('')}
      </div>
    </div>
  `;
    }

    function toggleStopsList(btn) {
      btn.classList.toggle('open');
      const list = btn.nextElementSibling;
      list.classList.toggle('visible');
      const isOpen = btn.classList.contains('open');
      btn.querySelector('span').textContent = isOpen
        ? t('hide_stops')
        : t('show_stops');
    }

    function renderStop(s, i, total) {
      const passed = s.partenzaReale || s.arrivoReale;
      const isCurr = !passed && i > 0 && i < total - 1;
      const dotClass = passed ? 'passed' : isCurr ? 'current' : '';
      const del = s.ritardoPartenza || s.ritardo || 0;
      return `
    <div class="stop-item" style="animation-delay:${i * 0.03}s">
      <div class="stop-dot ${dotClass}"></div>
      <div class="stop-name">${s.stazione || '—'}<small>${fmtDate(s.programmata)}</small></div>
      <div class="stop-time">${fmtTime(s.programmata)}</div>
      <div class="stop-delay"><span class="delay-badge ${delayClass(del)}">${delayText(del)}</span></div>
    </div>
  `;
    }

    /* ════════════════════════════════════════════════════
       LEAFLET MAP INIT
    ════════════════════════════════════════════════════ */
    async function initTrainMap(stops, containerId) {
      // Destroy previous map if any (for inline train-result)
      if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }

      const container = document.getElementById(containerId);
      if (!container) return;

      // Batch geocode all stops in a single request
      const stationNames = stops.map(s => s.stazione || '').filter(Boolean);
      let geoMap = {};
      try {
        const resp = await fetch(`${API}/geocode/batch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stations: stationNames })
        });
        if (resp.ok) geoMap = await resp.json();
      } catch (e) { /* silently fail */ }

      // Build list of [index, lat, lon] for valid results
      const coords = [];
      stops.forEach((s, i) => {
        const name = s.stazione || '';
        const geo = geoMap[name];
        if (geo && geo.lat) {
          coords.push({ idx: i, lat: geo.lat, lon: geo.lon });
        }
      });

      // Remove loading indicator
      const loadingEl = container.querySelector('.map-loading');
      if (loadingEl) loadingEl.remove();

      if (!coords.length) {
        container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:.82rem">${t('no_geo')}</div>`;
        return;
      }

      // Init Leaflet
      const map = L.map(container, { zoomControl: true, attributionControl: true });
      _leafletMap = map;

      L.tileLayer(getTileUrl(), {
        attribution: '© OpenStreetMap contributors © CARTO',
        maxZoom: 18
      }).addTo(map);

      const total = stops.length;
      const latLngs = [];

      coords.forEach(({ idx, lat, lon }) => {
        const s = stops[idx];
        const passed = s.partenzaReale || s.arrivoReale;
        const isCurr = !passed && idx > 0 && idx < total - 1;

        let fillColor, color, radius, weight;

        if (passed) {
          // Past stop
          const style = getComputedStyle(document.documentElement);
          fillColor = color = style.getPropertyValue('--accent2').trim() || '#1d4ed8';
          radius = 6; weight = 1;
        } else if (isCurr) {
          // Current stop
          const style = getComputedStyle(document.documentElement);
          fillColor = color = style.getPropertyValue('--accent').trim() || '#3b82f6';
          radius = 9; weight = 2;
        } else {
          // Future stop
          fillColor = 'transparent';
          const style = getComputedStyle(document.documentElement);
          color = style.getPropertyValue('--border').trim() || '#1e2238';
          radius = 6; weight = 2;
        }

        const del = s.ritardoPartenza || s.ritardo || 0;
        const popupContent = `
      <b>${s.stazione || '—'}</b><br>
      ${fmtTime(s.programmata)}
      ${del > 0 ? `<br>${t('delay')}: +${del} min` : ''}
    `;

        const marker = L.circleMarker([lat, lon], {
          radius,
          fillColor,
          color,
          weight,
          opacity: 1,
          fillOpacity: fillColor === 'transparent' ? 0 : 1,
        }).bindPopup(popupContent).addTo(map);

        latLngs.push([lat, lon]);
      });

      // Polyline through all geocoded stops in order
      if (latLngs.length > 1) {
        const style = getComputedStyle(document.documentElement);
        const accentColor = style.getPropertyValue('--accent').trim() || '#3b82f6';
        L.polyline(latLngs, {
          color: accentColor,
          opacity: 0.5,
          weight: 2,
        }).addTo(map);
      }

      // Fit bounds
      map.fitBounds(latLngs, { padding: [40, 40] });

      // Fix rendering glitch in modal
      setTimeout(() => map.invalidateSize(), 100);
    }

    /* ════════════════════════════════════════════════════
       NEWS
    ════════════════════════════════════════════════════ */
    async function loadNews() {
      const wrap = document.getElementById('news-wrap');
      wrap.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const data = await apiFetch('/news');
        const arr = Array.isArray(data) ? data : (data?.items || data?.news || []);
        if (!arr.length) { wrap.innerHTML = `<div class="empty">${t('no_news')}</div>`; return; }
        wrap.innerHTML = `<div class="news-list">${arr.map((n, i) => renderNews(n, i)).join('')}</div>`;
      } catch (e) {
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${t('error_news')}</div>`;
      }
    }

    function renderNews(n, i) {
      const title = n.titolo || n.title || n.nome || '—';
      const date = n.dataCreazione || n.data || n.date || '';
      const body = n.testo || n.body || n.descrizione || '';
      return `
    <div class="news-item" style="animation-delay:${i * 0.05}s" onclick="this.classList.toggle('expanded')">
      <div class="news-title">${title}</div>
      <div class="news-date">${date ? new Date(date).toLocaleDateString('it-IT', { day: '2-digit', month: 'long', year: 'numeric' }) : ''}</div>
      ${body ? `<div class="news-body">${body}</div>` : ''}
    </div>
  `;
    }

    /* ════════════════════════════════════════════════════
       INIT
    ════════════════════════════════════════════════════ */
    renderHistory();
    loadStats();
    statsInterval = setInterval(loadStats, 60000);

    // Keyboard shortcut: Escape closes detail
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
  </script>
</body>
